<!-- Card 2 -->
<button class="bg-surface-container hover:bg-surface-container-high transition-colors text-left rounded-xl p-md flex flex-col items-start h-full shadow-sm">

<span class="material-symbols-outlined text-[24px]">lightbulb</span>
</div>

<p class="text-caption text-on-surface-variant flex-1">Best practices for matching, messaging, and meeting up in person.</p>
</button>
<!-- Card 3 -->
<button class="bg-surface-container hover:bg-surface-container-high transition-colors text-left rounded-xl p-md flex flex-col items-start h-full shadow-sm">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-[24px]">lock</span>
</div>
<h3 class="text-label-md text-on-surface mb-base">Privacy Settings</h3>
<p class="text-caption text-on-surface-variant flex-1">Control who sees your profile and what information you share.</p>
</button>
</div>
</div>

</div>

</button>
