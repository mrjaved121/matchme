<div class="flex items-center justify-between mb-xl">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1 px-lg">
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-[30%] transition-all duration-500 ease-out"></div>
</div>
</div>
<div class="w-12"></div>
</div>
<div class="flex flex-col flex-1">
<h1 class="font-headline-lg-mobile text-on-surface mb-2">I am a...</h1>
<p class="font-body-md text-on-surface-variant mb-xl">Choose how you identify.</p>
<div class="flex flex-col gap-sm" id="gender-selection">
<label class="relative flex items-center p-md rounded-[24px] bg-surface-container cursor-pointer transition-all duration-200 hover:bg-surface-container-high group" data-selected="false">
<input class="sr-only peer" name="gender" type="radio" value="woman"/>
<div class="absolute inset-0 rounded-[24px] pointer-events-none transition-all duration-200 shadow-sm opacity-0 peer-checked:opacity-100 peer-checked:bg-secondary-container peer-checked:ring-2 peer-checked:ring-primary-container"></div>
<span class="relative font-headline-md text-on-surface peer-checked:text-on-secondary-fixed-variant ml-sm z-10 w-full text-center">Woman</span>
</label>
<label class="relative flex items-center p-md rounded-[24px] bg-surface-container cursor-pointer transition-all duration-200 hover:bg-surface-container-high group" data-selected="false">
<input class="sr-only peer" name="gender" type="radio" value="man"/>
<div class="absolute inset-0 rounded-[24px] pointer-events-none transition-all duration-200 shadow-sm opacity-0 peer-checked:opacity-100 peer-checked:bg-secondary-container peer-checked:ring-2 peer-checked:ring-primary-container"></div>
<span class="relative font-headline-md text-on-surface peer-checked:text-on-secondary-fixed-variant ml-sm z-10 w-full text-center">Man</span>
</label>
<label class="relative flex items-center p-md rounded-[24px] bg-surface-container cursor-pointer transition-all duration-200 hover:bg-surface-container-high group" data-selected="false">
<input class="sr-only peer" name="gender" type="radio" value="nonbinary"/>
<div class="absolute inset-0 rounded-[24px] pointer-events-none transition-all duration-200 shadow-sm opacity-0 peer-checked:opacity-100 peer-checked:bg-secondary-container peer-checked:ring-2 peer-checked:ring-primary-container"></div>
<span class="relative font-headline-md text-on-surface peer-checked:text-on-secondary-fixed-variant ml-sm z-10 w-full text-center">Nonbinary</span>
</label>
</div>
<button class="mt-lg self-center font-label-md text-primary-container hover:text-primary transition-colors underline-offset-4 hover:underline py-xs px-md">
      More gender options
    </button>
</div>
<div class="mt-auto pt-xl">
<button class="w-full py-md px-lg rounded-full bg-gradient-to-b from-[#FF5864] to-[#FF7A84] text-white font-headline-md shadow-[0_12px_32px_rgba(255,88,100,0.25)] active:scale-[0.98] transition-transform flex items-center justify-center gap-xs disabled:opacity-50 disabled:active:scale-100" disabled="" id="continue-btn">
      Continue
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const radios = document.querySelectorAll('input[name="gender"]');
      const continueBtn = document.getElementById('continue-btn');
      
      radios.forEach(radio => {
        radio.addEventListener('change', (e) => {
          if(e.target.checked) {
            continueBtn.disabled = false;
            
            // Add subtle pulse animation to button when enabled
            continueBtn.animate([
              { transform: 'scale(1)' },
              { transform: 'scale(1.02)' },
              { transform: 'scale(1)' }
            ], {
              duration: 300,
              easing: 'ease-in-out'
            });
          }
        });
      });
    });
  </script>
</div></main></body></html>
