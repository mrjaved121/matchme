<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-secondary-container":"#6d6166","surface-variant":"#e20fc","tertiary-fixed":"#d3e4ff","surface-container-low":"#f5f2ff","surface-container-highest":"#e2e0fc",outline:"#8e706f","on-secondary-fixed":"#22191d","secondary-fixed":"#efdee4","inverse-primary":"#ffb3b3",secondary:"#675b60","outline-variant":"#e2bebd","inverse-surface":"#2f2e43","primary-fixed":"#ffdad9","on-tertiary":"#ffffff","on-error-container":"#93000a","on-background":"#1a1a2e","on-surface":"#1a1a2e","tertiary-container":"#2f96f7","on-secondary":"#ffffff","primary-container":"#ff5864","surface-container-high":"#e8e5ff","on-tertiary-container":"#002d53","secondary-fixed-dim":"#d2c2c8","on-tertiary-fixed":"#001c38",error:"#ba1a1a","on-tertiary-fixed-variant":"#004880","error-container":"#ffdad6","surface-dim":"#dad7f3","primary-fixed-dim":"#ffb3b3","on-secondary-fixed-variant":"#4f4449","on-error":"#ffffff","tertiary-fixed-dim":"#a1c9ff","surface-bright":"#fcf8ff","inverse-on-surface":"#f2efff",primary:"#b62135",background:"#fcf8ff","on-primary-fixed-variant":"#920021","on-primary-container":"#5f0012","surface-container":"#efecff","on-surface-variant":"#5a4040",tertiary:"#0060a8",surface:"#fcf8ff","surface-container-lowest":"#ffffff","secondary-container":"#efdee4","on-primary":"#ffffff","surface-tint":"#b62135","on-primary-fixed":"#400009"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{lg:"24px","margin-desktop":"40px",xs:"8px",md:"16px",sm:"12px","margin-mobile":"20px",gutter:"16px",xl:"32px",base:"4px"},fontFamily:{"headline-md":["Inter"],"body-md":["Inter"],"headline-lg":["Inter"],display:["Inter"],"body-lg":["Inter"],"headline-lg-mobile":["Inter"],caption:["Inter"],"label-md":["Inter"]},fontSize:{"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],display:["40px",{lineHeight:"48px",letterSpacing:"-0.02em",fontWeight:"700"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg-mobile":["28px",{lineHeight:"34px",fontWeight:"700"}],caption:["12px",{lineHeight:"16px",fontWeight:"400"}],"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}]}}}}</script><style>@layer base{.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}.pt-safe{padding-top:env(safe-area-inset-top,0)}body{overscroll-behavior:none}}::-webkit-scrollbar{display:none}</style></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full"><div class="flex flex-col w-full h-full justify-between pb-lg px-margin-mobile">
<div class="flex flex-col items-center pt-xl w-full max-w-sm mx-auto">
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]">
        lock_open
      </span>
</div>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-background text-center mb-xs">
      Verify your number
    </h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center mb-xl">
      Enter the 6-digit code sent to<br>
<span class="font-label-md text-on-background">+1 ••• ••• 1234</span>
</p>
<div class="flex flex-row justify-between w-full gap-2 mb-lg" id="otp-container">
<input autofocus="" class="w-12 h-14 bg-surface-container rounded-xl text-center text-headline-md font-headline-md text-on-background focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-shadow otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="w-12 h-14 bg-surface-container rounded-xl text-center text-headline-md font-headline-md text-on-background focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-shadow otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="w-12 h-14 bg-surface-container rounded-xl text-center text-headline-md font-headline-md text-on-background focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-shadow otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="w-12 h-14 bg-surface-container rounded-xl text-center text-headline-md font-headline-md text-on-background focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-shadow otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="w-12 h-14 bg-surface-container rounded-xl text-center text-headline-md font-headline-md text-on-background focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-shadow otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="w-12 h-14 bg-surface-container rounded-xl text-center text-headline-md font-headline-md text-on-background focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-shadow otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
</div>
<div class="flex items-center justify-center space-x-2 text-body-md font-body-md">
<span class="text-on-surface-variant">Didn't receive it?</span>
<button class="text-primary font-label-md hover:opacity-80 transition-opacity" id="resend-btn" disabled="">
        Resend in <span id="timer">00:55</span>
</button>
</div>
</div>
<div class="w-full mt-auto pt-lg">
<button class="w-full py-4 rounded-full bg-gradient-to-b from-primary-container to-[#FF7A84] text-on-primary font-label-md text-[16px] shadow-[0_12px_32px_rgba(255,88,100,0.2)] hover:shadow-[0_16px_40px_rgba(255,88,100,0.3)] transition-all active:scale-[0.98]">
      Verify
    </button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.otp-input');
    
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1) {
          if (index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
      
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/[^0-9]/g, '');
        if (pastedData) {
            for (let i = 0; i < pastedData.length; i++) {
                if (inputs[index + i]) {
                    inputs[index + i].value = pastedData[i];
                }
            }
            if (index + pastedData.length < inputs.length) {
                inputs[index + pastedData.length].focus();
            } else {
                inputs[inputs.length - 1].focus();
            }
        }
      });
    });

    let timeLeft = 55;
    const timerDisplay = document.getElementById('timer');
    const resendBtn = document.getElementById('resend-btn');

    const countdown = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        resendBtn.innerHTML = 'Resend Code';
        resendBtn.disabled = false;
      } else {
        const seconds = timeLeft.toString().padStart(2, '0');
        timerDisplay.textContent = `00:${seconds}`;
      }
    }, 1000);
  });
</script></main></body></html>
