<style>
    @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes slide-in-left {
        from { opacity: 0; transform: translateX(-50px) rotate(-15deg); }
        to { opacity: 1; transform: translateX(0) rotate(-6deg); }
    }
    @keyframes slide-in-right {
        from { opacity: 0; transform: translateX(50px) rotate(15deg); }
        to { opacity: 1; transform: translateX(0) rotate(6deg); }
    }
    @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-fast {
        0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 88, 100, 0.7); }
        70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 88, 100, 0); }
        100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 88, 100, 0); }
    }
    .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
    .animate-slide-in-left { animation: slide-in-left 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-slide-in-right { animation: slide-in-right 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-fade-up { animation: fade-up 0.5s ease-out forwards; opacity: 0; }
    .animate-pulse-fast { animation: pulse-fast 1.5s infinite; }
</style>
<script>
    // Simple particle system for sparks
    document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.getElementById('spark-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = canvas.offsetWidth;
        let height = canvas.height = canvas.offsetHeight;
        
        const particles = [];
        const colors = ['#FF5864', '#FF7A84', '#FBEAF0', '#FFDAD9'];
        
        class Particle {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 4 + 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // slight gravity
                this.life -= this.decay;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${hexToRgb(this.color)}, ${this.life})`;
                ctx.fill();
            }
        }
        
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255, 88, 100';
        }
        
        // Initial burst
        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Add occasional new particles
            if (Math.random() < 0.1 && particles.length < 100) {
                particles.push(new Particle());
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        });
    });
</script></main></body></html>
