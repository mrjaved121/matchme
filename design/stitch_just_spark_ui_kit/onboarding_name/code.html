<div class="h-1 bg-primary-container rounded-full w-[10%]"></div>
</div>
<!-- Top Navigation -->
<div class="flex items-center w-full mb-xl">
<button class="text-on-surface-variant p-xs -ml-xs">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</div>
<!-- Content -->
<div class="flex-1 flex flex-col justify-center max-w-md mx-auto w-full pb-xl">
<h1 class="font-display text-display text-on-background mb-lg">What's your name?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">This is how it will appear on your profile.</p>
<!-- Input Field -->
<div class="relative w-full">
<input class="w-full bg-surface-container-low text-on-background font-body-lg text-body-lg px-md py-lg rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-container transition-shadow shadow-[0_8px_24px_rgba(26,26,46,0.04)]" id="firstNameInput" placeholder="First name" type="text"/>
</div>
</div>
<!-- Bottom Action -->
<div class="w-full mt-auto pt-lg pb-md">
<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-md rounded-full shadow-[0_12px_32px_rgba(255,88,100,0.08)] disabled:opacity-50 disabled:cursor-not-allowed transition-opacity" disabled="" id="continueBtn">
            Continue
        </button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('firstNameInput');
            const btn = document.getElementById('continueBtn');

            input.addEventListener('input', (e) => {
                if (e.target.value.trim().length > 0) {
                    btn.removeAttribute('disabled');
                } else {
                    btn.setAttribute('disabled', 'true');
                }
            });
        });
    </script>
