<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

neHeight:"32px",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],display:["40px",{lineHeight:"48px",letterSpacing:"-0.02em",fontWeight:"700"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg-mobile":["28px",{lineHeight:"34px",fontWeight:"700"}],caption:["12px",{lineHeight:"16px",fontWeight:"400"}],"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}]}}}}</script><style>@layer base{.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}.pt-safe{padding-top:env(safe-area-inset-top,0)}body{overscroll-behavior:none}}::-webkit-scrollbar{display:none}</style></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full"><div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
<!-- Decorative Ambient Background Elements -->
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-fixed-dim/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute top-1/4 -right-24 w-80 h-80 bg-tertiary-fixed-dim/10 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-40 -left-10 w-full h-96 bg-primary-container/10 rounded-[100px] blur-[120px] pointer-events-none"></div>
<div class="flex flex-col px-margin-mobile md:px-margin-desktop py-xl md:py-margin-desktop w-full max-w-md mx-auto z-10">
<!-- Header -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-surface-container rounded-2xl flex items-center justify-center mb-sm shadow-sm relative group overflow-hidden">
<span class="material-symbols-outlined text-primary text-[32px] group-hover:scale-110 transition-transform duration-500 ease-out z-10" style="font-variation-settings: 'FILL' 1;">favorite</span>
<div class="absolute inset-0 bg-gradient-to-tr from-primary-container/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-on-background text-center mb-base">Find Your Spark</h1>
<p class="font-body-md text-on-surface-variant text-center">Join today and start building kind connections.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-lg w-full" id="signup-form">
<!-- Input Fields Group -->
<div class="flex flex-col gap-md w-full">
<!-- Name -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-on-surface ml-base" for="name">First Name</label>
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 transition-colors group-focus-within:text-primary">person</span>
<input class="w-full bg-surface-container text-on-surface font-body-md py-sm pl-[44px] pr-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all duration-300 placeholder:text-on-surface-variant/60 shadow-[0_2px_12px_rgba(26,26,46,0.02)]" id="name" placeholder="How should we call you?" required="" type="text">
</div>
</div>
<!-- Email / Phone -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-on-surface ml-base" for="contact">Email or Phone</label>
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 transition-colors group-focus-within:text-primary">mail</span>
<input class="w-full bg-surface-container text-on-surface font-body-md py-sm pl-[44px] pr-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all duration-300 placeholder:text-on-surface-variant/60 shadow-[0_2px_12px_rgba(26,26,46,0.02)]" id="contact" placeholder="hello@example.com" required="" type="text">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-on-surface ml-base" for="password">Password</label>
<div class="relative w-full group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 transition-colors group-focus-within:text-primary">lock</span>
<input class="w-full bg-surface-container text-on-surface font-body-md py-sm pl-[44px] pr-[44px] rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all duration-300 placeholder:text-on-surface-variant/60 shadow-[0_2px_12px_rgba(26,26,46,0.02)]" id="password" placeholder="Create a strong password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors z-10 flex items-center justify-center w-8 h-8 rounded-full focus:outline-none focus:bg-surface-container-highest" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
</div>
<!-- Agreements -->
<div class="flex flex-col gap-sm w-full bg-surface-container-low p-md rounded-[20px] shadow-[0_4px_16px_rgba(26,26,46,0.03)]">
<!-- Age -->
<label class="flex items-start gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 mt-0.5 shrink-0">
<input class="peer appearance-none w-5 h-5 rounded-md bg-surface border-2 border-outline-variant checked:bg-primary checked:border-primary transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:ring-offset-1 focus:ring-offset-surface-container-low" required="" type="checkbox">
<span class="material-symbols-outlined absolute text-on-primary text-[16px] scale-0 peer-checked:scale-100 transition-transform duration-200 pointer-events-none" style="font-variation-settings: 'wght' 600;">check</span>
</div>
<span class="font-body-md text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">I confirm that I am 18 years of age or older.</span>
</label>
<!-- Terms -->
<label class="flex items-start gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 mt-0.5 shrink-0">
<input class="peer appearance-none w-5 h-5 rounded-md bg-surface border-2 border-outline-variant checked:bg-primary checked:border-primary transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:ring-offset-1 focus:ring-offset-surface-container-low" required="" type="checkbox">
<span class="material-symbols-outlined absolute text-on-primary text-[16px] scale-0 peer-checked:scale-100 transition-transform duration-200 pointer-events-none" style="font-variation-settings: 'wght' 600;">check</span>
</div>
<span class="font-body-md text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">I agree to the <a class="text-primary font-label-md hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-label-md hover:underline" href="#">Privacy Policy</a>.</span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full py-md rounded-full bg-gradient-to-b from-primary-container to-[#FF7A84] text-on-primary font-label-md text-[16px] shadow-[0_12px_32px_rgba(255,88,100,0.25)] hover:shadow-[0_16px_40px_rgba(255,88,100,0.35)] hover:-translate-y-1 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-primary/20 relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center justify-center gap-xs">
                    Create account
                    <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform duration-300">arrow_forward</span>
</span>
<!-- Hover effect overlay -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md w-full my-lg opacity-70">
<div class="flex-1 h-[1px] bg-outline-variant"></div>
<span class="font-caption text-on-surface-variant uppercase tracking-wider">or sign up with</span>
<div class="flex-1 h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Auth -->
<div class="flex gap-md w-full mb-xl">
<button class="flex-1 py-sm px-md flex items-center justify-center gap-sm bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md rounded-[16px] shadow-[0_2px_8px_rgba(26,26,46,0.04)] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<!-- Using inline SVG for Google G to avoid external dependencies, simple stylized version -->
<svg class="shrink-0" fill="none" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
<button class="flex-1 py-sm px-md flex items-center justify-center gap-sm bg-inverse-surface hover:bg-[#1a1a2e] text-on-error font-label-md rounded-[16px] shadow-[0_2px_8px_rgba(26,26,46,0.08)] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">file_download</span>
                Apple
            </button>
</div>
<!-- Login Link -->
<div class="flex justify-center items-center w-full mt-auto mb-lg">
<span class="font-body-md text-on-surface-variant">Already have an account? </span>
<a class="ml-base font-label-md text-primary hover:text-primary-container transition-colors py-2 px-3 -my-2 -mx-3 rounded-lg hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-primary" href="#login">
                Log in
            </a>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibility-icon');

        if(toggleBtn && passwordInput && visibilityIcon) {
            toggleBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                
                // Add a little pop animation to the icon
                visibilityIcon.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    visibilityIcon.style.transform = 'scale(1)';
                    visibilityIcon.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                }, 50);
            });
        }
    });
</script></main></body></html>
