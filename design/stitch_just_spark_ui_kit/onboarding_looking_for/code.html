eight:"32px",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],display:["40px",{lineHeight:"48px",letterSpacing:"-0.02em",fontWeight:"700"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg-mobile":["28px",{lineHeight:"34px",fontWeight:"700"}],caption:["12px",{lineHeight:"16px",fontWeight:"400"}],"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}]}}}}</script><style>@layer base{.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}.pt-safe{padding-top:env(safe-area-inset-top,0)}body{overscroll-behavior:none}}::-webkit-scrollbar{display:none}</style></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full"><div class="flex flex-col w-full h-full relative px-margin-mobile md:px-margin-desktop py-lg">
<!-- Header / Progress -->
<div class="flex flex-col w-full mb-xl">
<div class="flex items-center justify-between mb-lg w-full">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-headline-md">arrow_back</span>
</button>
<div class="flex-1 px-lg">
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-[40%] transition-all duration-500 ease-out"></div>
</div>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
<h1 class="font-display text-display text-on-background mb-xs">Who do you want to meet?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">You can change this later.</p>
</div>
<!-- Options -->
<div class="flex flex-col gap-md flex-1 w-full" id="gender-selection-container">
<!-- Option: Women -->
<label class="relative flex items-center justify-between p-lg rounded-[24px] bg-surface-container cursor-pointer transition-all duration-300 group hover:shadow-sm" data-selected="false">
<input class="peer sr-only" name="preference" type="checkbox" value="women"/>
<div class="flex items-center gap-md z-10 pointer-events-none">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface peer-checked:text-primary-container peer-checked:bg-on-primary transition-colors">
<span class="material-symbols-outlined text-headline-md">female</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Women</span>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center z-10 transition-colors pointer-events-none peer-checked:bg-primary-container peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<!-- Selected Background Overlay -->
<div class="absolute inset-0 rounded-[24px] bg-secondary-container opacity-0 peer-checked:opacity-100 transition-opacity z-0 pointer-events-none"></div>
</label>
<!-- Option: Men -->
<label class="relative flex items-center justify-between p-lg rounded-[24px] bg-surface-container cursor-pointer transition-all duration-300 group hover:shadow-sm" data-selected="false">
<input class="peer sr-only" name="preference" type="checkbox" value="men"/>
<div class="flex items-center gap-md z-10 pointer-events-none">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface peer-checked:text-primary-container peer-checked:bg-on-primary transition-colors">
<span class="material-symbols-outlined text-headline-md">male</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Men</span>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center z-10 transition-colors pointer-events-none peer-checked:bg-primary-container peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<!-- Selected Background Overlay -->
<div class="absolute inset-0 rounded-[24px] bg-secondary-container opacity-0 peer-checked:opacity-100 transition-opacity z-0 pointer-events-none"></div>
</label>
<!-- Option: Everyone -->
<label class="relative flex items-center justify-between p-lg rounded-[24px] bg-surface-container cursor-pointer transition-all duration-300 group hover:shadow-sm" data-selected="false">
<input class="peer sr-only" name="preference" type="checkbox" value="everyone"/>
<div class="flex items-center gap-md z-10 pointer-events-none">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface peer-checked:text-primary-container peer-checked:bg-on-primary transition-colors">
<span class="material-symbols-outlined text-headline-md">group</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Everyone</span>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center z-10 transition-colors pointer-events-none peer-checked:bg-primary-container peer-checked:text-on-primary">
<span class="material-symbols-outlined text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<!-- Selected Background Overlay -->
<div class="absolute inset-0 rounded-[24px] bg-secondary-container opacity-0 peer-checked:opacity-100 transition-opacity z-0 pointer-events-none"></div>
</label>
<!-- Decorative subtle element -->
<div class="w-full flex justify-center mt-xl opacity-30 pointer-events-none">
<svg fill="none" height="40" viewbox="0 0 120 40" width="120" xmlns="http://www.w3.org/2000/svg">
<path class="text-primary-container" d="M10 20 Q 30 0, 50 20 T 90 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
<circle class="text-primary-container" cx="90" cy="20" fill="currentColor" r="4"></circle>
</svg>
</div>
</div>
<!-- Sticky Bottom Action -->
<div class="mt-auto pt-xl pb-md w-full bg-gradient-to-t from-background via-background to-transparent sticky bottom-0 z-20">
<button class="w-full h-14 rounded-full bg-surface-container-high text-on-surface-variant font-label-md text-label-md flex items-center justify-center transition-all duration-300 cursor-not-allowed opacity-70" disabled="" id="continue-btn">
            Continue
        </button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const checkboxes = document.querySelectorAll('input[name="preference"]');
        const continueBtn = document.getElementById('continue-btn');
        const everyoneCheckbox = document.querySelector('input[value="everyone"]');

        function updateContinueButton() {
            const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
            
            if (anyChecked) {
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                continueBtn.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md', 'shadow-primary-container/20', 'hover:shadow-lg', 'active:scale-[0.98]');
            } else {
                continueBtn.disabled = true;
                continueBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                continueBtn.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-md', 'shadow-primary-container/20', 'hover:shadow-lg', 'active:scale-[0.98]');
            }
        }

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const clickedValue = e.target.value;
                
                // Logic: If 'Everyone' is checked, uncheck others. If others are checked, uncheck 'Everyone'
                if (clickedValue === 'everyone' && e.target.checked) {
                    checkboxes.forEach(cb => {
                        if (cb.value !== 'everyone') cb.checked = false;
                    });
                } else if (e.target.checked) {
                    everyoneCheckbox.checked = false;
                }

                updateContinueButton();

                // Add a small pop animation to the clicked card
                if(e.target.checked) {
                    const label = e.target.closest('label');
                    label.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        label.style.transform = 'scale(1)';
                    }, 150);
                }
            });
        });

        // Add ripple effect to continue button
        continueBtn.addEventListener('click', function(e) {
            if (this.disabled) return;
            
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const ripple = document.createElement('span');
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.className = 'absolute bg-white/30 rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 animate-ripple';
            
            // Need to ensure button has position relative overflow hidden in CSS but inline here for safety
            this.style.position = 'relative';
            this.style.overflow = 'hidden';
            
            this.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
    });
</script>
<style>
    @keyframes ripple {
        0% { width: 0; height: 0; opacity: 1; }
        100% { width: 500px; height: 500px; opacity: 0; }
    }
    .animate-ripple {
        animation: ripple 0.6s ease-out forwards;
    }
</style></main></body></html>
