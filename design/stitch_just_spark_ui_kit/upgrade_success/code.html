<span>Start Swiping</span>
<span class="material-symbols-outlined ml-xs">arrow_forward</span>
</button>

<script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('confetti-container');
      const colors = ['#FF5864', '#FF7A84', '#FBEAF0', '#FFD166'];
      
      for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('absolute', 'rounded-sm');
        
        const size = Math.random() * 8 + 4;
        confetti.style.width = `${size}px`;
        confetti.style.height = `${size}px`;
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        confetti.style.left = `${Math.random() * 100}%`;
        confetti.style.top = `-20px`;
        
        const duration = Math.random() * 3 + 2;
        const delay = Math.random() * 2;
        
        confetti.style.animation = `fall ${duration}s ease-in ${delay}s infinite`;
        
        container.appendChild(confetti);
      }
      
      const style = document.createElement('style');
      style.innerHTML = `
        @keyframes fall {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    });
  </script>
