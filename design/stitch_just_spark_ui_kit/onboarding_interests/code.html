<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-secondary-container":"#6d6166","surface-variant":"#e20fc","tertiary-fixed":"#d3e4ff","surface-container-low":"#f5f2ff","surface-container-highest":"#e2e0fc",outline:"#8e706f","on-secondary-fixed":"#22191d","secondary-fixed":"#efdee4","inverse-primary":"#ffb3b3",secondary:"#675b60","outline-variant":"#e2bebd","inverse-surface":"#2f2e43","primary-fixed":"#ffdad9","on-tertiary":"#ffffff","on-error-container":"#93000a","on-background":"#1a1a2e","on-surface":"#1a1a2e","tertiary-container":"#2f96f7","on-secondary":"#ffffff","primary-container":"#ff5864","surface-container-high":"#e8e5ff","on-tertiary-container":"#002d53","secondary-fixed-dim":"#d2c2c8","on-tertiary-fixed":"#001c38",error:"#ba1a1a","on-tertiary-fixed-variant":"#004880","error-container":"#ffdad6","surface-dim":"#dad7f3","primary-fixed-dim":"#ffb3b3","on-secondary-fixed-variant":"#4f4449","on-error":"#ffffff","tertiary-fixed-dim":"#a1c9ff","surface-bright":"#fcf8ff","inverse-on-surface":"#f2efff",primary:"#b62135",background:"#fcf8ff","on-primary-fixed-variant":"#920021","on-primary-container":"#5f0012","surface-container":"#efecff","on-surface-variant":"#5a4040",tertiary:"#0060a8",surface:"#fcf8ff","surface-container-lowest":"#ffffff","secondary-container":"#efdee4","on-primary":"#ffffff","surface-tint":"#b62135","on-primary-fixed":"#400009"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{lg:"24px","margin-desktop":"40px",xs:"8px",md:"16px",sm:"12px","margin-mobile":"20px",gutter:"16px",xl:"32px",base:"4px"},fontFamily:{"headline-md":["Inter"],"body-md":["Inter"],"headline-lg":["Inter"],display:["Inter"],"body-lg":["Inter"],"headline-lg-mobile":["Inter"],caption:["Inter"],"label-md":["Inter"]},fontSize:{"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],display:["40px",{lineHeight:"48px",letterSpacing:"-0.02em",fontWeight:"700"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg-mobile":["28px",{lineHeight:"34px",fontWeight:"700"}],caption:["12px",{lineHeight:"16px",fontWeight:"400"}],"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}]}}}}</script><style>@layer base{.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}.pt-safe{padding-top:env(safe-area-inset-top,0)}body{overscroll-behavior:none}}::-webkit-scrollbar{display:none}</style></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full"><div class="flex flex-col w-full px-margin-mobile py-xl bg-surface relative min-h-screen">
<!-- Header / Nav -->
<div class="flex items-center justify-between mb-lg pt-safe">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 px-lg">
<div class="h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-[80%] transition-all duration-500"></div>
</div>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</div>
<!-- Content -->
<div class="flex flex-col flex-1 pb-safe">
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">What are you into?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Pick at least 3 to help us find better matches.</p>
</div>
<!-- Interest Chips -->
<div class="flex flex-wrap gap-sm mb-xl" id="interest-container">
<!-- Chips generated by JS -->
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Bottom Action -->
<div class="mt-auto pt-lg pb-margin-mobile sticky bottom-0 bg-surface">
<button class="w-full py-md rounded-full font-label-md text-label-md transition-all duration-300 flex items-center justify-center gap-xs shadow-[0_12px_32px_rgba(255,88,100,0.08)] bg-surface-container-highest text-on-surface-variant opacity-50 cursor-not-allowed" disabled="" id="continue-btn">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const interests = [
        { id: 'travel', label: 'Travel', icon: 'flight' },
        { id: 'coffee', label: 'Coffee', icon: 'local_cafe' },
        { id: 'music', label: 'Music', icon: 'music_note' },
        { id: 'fitness', label: 'Fitness', icon: 'fitness_center' },
        { id: 'food', label: 'Food', icon: 'restaurant' },
        { id: 'art', label: 'Art', icon: 'palette' },
        { id: 'gaming', label: 'Gaming', icon: 'sports_esports' },
        { id: 'movies', label: 'Movies', icon: 'movie' },
        { id: 'reading', label: 'Reading', icon: 'menu_book' },
        { id: 'nature', label: 'Nature', icon: 'park' },
        { id: 'pets', label: 'Pets', icon: 'pets' },
        { id: 'photo', label: 'Photography', icon: 'camera_alt' },
        { id: 'sports', label: 'Sports', icon: 'sports_baseball' },
        { id: 'cooking', label: 'Cooking', icon: 'skillet' },
        { id: 'wine', label: 'Wine', icon: 'wine_bar' },
        { id: 'yoga', label: 'Yoga', icon: 'self_improvement' },
        { id: 'hiking', label: 'Hiking', icon: 'hiking' }
      ];

      const container = document.getElementById('interest-container');
      const continueBtn = document.getElementById('continue-btn');
      let selectedCount = 0;

      interests.forEach(interest => {
        const chip = document.createElement('button');
        chip.className = 'flex items-center gap-xs px-md py-sm rounded-full bg-surface-container text-on-surface font-body-md text-body-md transition-all duration-200 select-none touch-manipulation active:scale-95';
        chip.innerHTML = `
          <span class="material-symbols-outlined text-[20px] transition-colors">${interest.icon}</span>
          <span>${interest.label}</span>
        `;
        
        let isSelected = false;
        
        chip.addEventListener('click', () => {
          isSelected = !isSelected;
          
          if (isSelected) {
            chip.classList.remove('bg-surface-container', 'text-on-surface');
            chip.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');
            selectedCount++;
          } else {
            chip.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
            chip.classList.add('bg-surface-container', 'text-on-surface');
            selectedCount--;
          }
          
          updateButtonState();
        });
        
        container.appendChild(chip);
      });

      function updateButtonState() {
        if (selectedCount >= 3) {
          continueBtn.disabled = false;
          continueBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
          continueBtn.classList.add('bg-gradient-to-b', 'from-primary-container', 'to-[#FF7A84]', 'text-on-primary', 'shadow-[0_12px_32px_rgba(255,88,100,0.2)]');
        } else {
          continueBtn.disabled = true;
          continueBtn.classList.add('bg-surface-container-highest', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
          continueBtn.classList.remove('bg-gradient-to-b', 'from-primary-container', 'to-[#FF7A84]', 'text-on-primary', 'shadow-[0_12px_32px_rgba(255,88,100,0.2)]');
        }
      }
    });
  </script>
</div></main></body></html>
