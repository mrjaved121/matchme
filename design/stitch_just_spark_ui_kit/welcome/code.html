neHeight:"32px",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],display:["40px",{lineHeight:"48px",letterSpacing:"-0.02em",fontWeight:"700"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg-mobile":["28px",{lineHeight:"34px",fontWeight:"700"}],caption:["12px",{lineHeight:"16px",fontWeight:"400"}],"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}]}}}}</script><style>@layer base{.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}.pt-safe{padding-top:env(safe-area-inset-top,0)}body{overscroll-behavior:none}}::-webkit-scrollbar{display:none}</style></head><body class="bg-background font-body-md text-on-background min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full"><div class="flex flex-col w-full h-full relative bg-surface overflow-hidden">

<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface/90"></div>
</div>
<!-- Content Container -->
<div class="flex-1 flex flex-col justify-between px-margin-mobile pt-lg pb-xl relative -mt-8">
<!-- Carousel Area -->
<div class="flex flex-col items-center text-center space-y-xs w-full overflow-hidden" id="carousel-container">
<div class="flex transition-transform duration-500 ease-in-out w-full" id="carousel-track">
<!-- Slide 1 -->
<div class="w-full shrink-0 flex flex-col items-center px-4">
<h1 class="font-headline-lg-mobile text-on-background mb-base text-balance">Meet people nearby</h1>
<p class="font-body-md text-on-surface-variant text-balance px-4">Discover genuine connections just around the corner.</p>
</div>
<!-- Slide 2 -->
<div class="w-full shrink-0 flex flex-col items-center px-4">
<h1 class="font-headline-lg-mobile text-on-background mb-base text-balance">Real, verified profiles</h1>
<p class="font-body-md text-on-surface-variant text-balance px-4">Feel secure knowing who you're talking to.</p>
</div>
<!-- Slide 3 -->
<div class="w-full shrink-0 flex flex-col items-center px-4">
<h1 class="font-headline-lg-mobile text-on-background mb-base text-balance">Chat and connect</h1>
<p class="font-body-md text-on-surface-variant text-balance px-4">Start meaningful conversations with ease.</p>
</div>
</div>
<!-- Dots Indicator -->
<div class="flex justify-center space-x-2 pt-6 pb-2" id="carousel-dots">
<button aria-label="Go to slide 1" class="w-2 h-2 rounded-full bg-primary transition-all duration-300"></button>
<button aria-label="Go to slide 2" class="w-2 h-2 rounded-full bg-outline-variant transition-all duration-300"></button>
<button aria-label="Go to slide 3" class="w-2 h-2 rounded-full bg-outline-variant transition-all duration-300"></button>

</div>
<!-- Actions Area -->
<div class="flex flex-col space-y-sm mt-8 w-full max-w-sm mx-auto">
<button class="w-full py-4 px-6 bg-surface-container-highest text-on-surface rounded-full font-label-md flex items-center justify-center space-x-3 shadow-[0_8px_24px_rgba(26,26,46,0.04)] active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">login</span>
<span>Continue with Google</span>
</button>
<button class="w-full py-4 px-6 bg-on-background text-on-primary rounded-full font-label-md flex items-center justify-center space-x-3 shadow-[0_8px_24px_rgba(26,26,46,0.04)] active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">file_download</span>
<span>Continue with Apple</span>
</button>
<button class="w-full py-4 px-6 bg-transparent text-primary rounded-full font-label-md flex items-center justify-center space-x-3 shadow-none border-2 border-primary active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">phone_iphone</span>
<span>Use phone number</span>
</button>
<div class="pt-6 text-center">
<span class="font-body-md text-on-surface-variant">Already have an account? </span>
<button class="font-label-md text-primary active:opacity-70 transition-opacity">Log in</button>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const track = document.getElementById('carousel-track');
      const dots = document.getElementById('carousel-dots').querySelectorAll('button');
      let currentIndex = 0;
      const totalSlides = dots.length;
      let interval;

      function updateCarousel(index) {
        track.style.transform = `translateX(-${index * 100}%)`;
        dots.forEach((dot, i) => {
          if (i === index) {
            dot.classList.remove('bg-outline-variant');
            dot.classList.add('bg-primary', 'w-4');
            dot.classList.remove('w-2');
          } else {
            dot.classList.add('bg-outline-variant', 'w-2');
            dot.classList.remove('bg-primary', 'w-4');
          }
        });
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % totalSlides;
        updateCarousel(currentIndex);
      }

      function startAutoplay() {
        interval = setInterval(nextSlide, 3500);
      }

      function stopAutoplay() {
        clearInterval(interval);
      }

      dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
          currentIndex = index;
          updateCarousel(currentIndex);
          stopAutoplay();
          startAutoplay();
        });
      });

      // Touch swipe support
      let touchStartX = 0;
      let touchEndX = 0;
      const swipeThreshold = 50;

      track.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        stopAutoplay();
      }, {passive: true});

      track.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
        startAutoplay();
      }, {passive: true});

      function handleSwipe() {
        if (touchEndX < touchStartX - swipeThreshold) {
          currentIndex = Math.min(currentIndex + 1, totalSlides - 1);
        }
        if (touchEndX > touchStartX + swipeThreshold) {
          currentIndex = Math.max(currentIndex - 1, 0);
        }
        updateCarousel(currentIndex);
      }

      startAutoplay();
      updateCarousel(0); // Initialize first dot state
    });
  </script>
