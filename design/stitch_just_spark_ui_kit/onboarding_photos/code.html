<div class="flex flex-col px-margin-mobile pt-lg pb-md gap-sm">
<div class="flex items-center justify-between">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface transition-transform active:scale-95">

<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary">

<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary">

<button class="relative w-full aspect-[3/4] rounded-[24px] bg-surface-container-low border-2 border-dashed border-outline-variant flex flex-col items-center justify-center gap-2 transition-colors hover:bg-surface-container active:scale-[0.98]">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-primary">

<script>
    // Simulate interaction for the empty slots to demo states
    document.querySelectorAll('button.border-dashed').forEach(btn => {
        btn.addEventListener('click', function() {
            // For demo purposes, we'll visually change one slot and activate the continue button
            if(this.classList.contains('border-dashed')) {
                // Add loading state
                this.innerHTML = '<span class="material-symbols-outlined animate-spin text-primary">sync</span>';
                
                setTimeout(() => {
                    // Turn it into a filled slot
                    this.className = 'relative w-full aspect-[3/4] rounded-[24px] bg-surface-container-highest overflow-hidden shadow-[0_8px_24px_rgba(26,26,46,0.04)] group';
                    this.innerHTML = `
                        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('placeholder')" data-alt="A candid, warm lifestyle photo of a young woman at a coffee shop, natural sunlight, soft focus background, inviting smile, casual chic attire."></div>
                        <button class="absolute bottom-3 right-3 w-8 h-8 rounded-full bg-white text-on-surface shadow-md flex items-center justify-center transition-transform active:scale-90">
                            <span class="material-symbols-outlined text-[18px]">close</span>
                        </button>
                    `;
                    
                    // Activate Continue Button
                    const continueBtn = document.getElementById('continueBtn');
                    continueBtn.className = 'w-full h-14 rounded-full bg-gradient-to-b from-[#FF5864] to-[#FF7A84] text-white font-label-md text-label-md flex items-center justify-center transition-all duration-300 shadow-[0_12px_32px_rgba(255,88,100,0.2)] active:scale-[0.98] cursor-pointer';
                    continueBtn.disabled = false;
                    continueBtn.nextElementSibling.style.opacity = '0';
                }, 800);
            }
        });
    });
